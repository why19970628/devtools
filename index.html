<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTools 开发者工具箱 - 极速按需加载版</title>
    <meta name="description" content="新一代现代化开发者工具箱，涵盖JSON格式化校验、加解密、代码美化、进制换算、网络调试等高效开发辅助工具。" />
    <script>
      (function () {
        try {
          var isManual = localStorage.getItem('devtools_theme_manual') === 'true';
          var saved = localStorage.getItem('devtools_theme');
          var theme;
          if (isManual && (saved === 'dark' || saved === 'light')) {
            theme = saved;
          } else {
            var hour = new Date().getHours();
            theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
