name: Feature request
description: Suggest a new tool or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - New tool
        - Improvement to an existing tool
        - UI / UX
        - Docs
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: Description
      description: What do you want, and why?
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Reference
      description: A link or screenshot of a similar tool, if any